<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Konta & Cie</title>
<meta name="description" content="A quiet ledger for your money. Spending, savings and statements — in order.">
<meta name="theme-color" content="#050507">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Konta">
<link rel="manifest" href="manifest.webmanifest?v=4">
<link rel="icon" type="image/png" sizes="192x192" href="k2-icon-192.png">
<link rel="apple-touch-icon" href="k2-touch-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --serif:"SF Pro Display",-apple-system,BlinkMacSystemFont,Manrope,system-ui,sans-serif;--disp:"SF Pro Display",-apple-system,BlinkMacSystemFont,Manrope,system-ui,sans-serif;
  --bg:#000; --iv:#f2efe9; --mut:#8a8781; --mut2:#4d4b48; --line:rgba(242,239,233,.08);
  --amb:#e9a15f; --sage:#9fbf98; --clay:#df7b62;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--iv);font:15px/1.45 Manrope,-apple-system,"SF Pro Text",system-ui,sans-serif;font-feature-settings:"tnum" 1;letter-spacing:-.005em;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:var(--iv)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block;overflow:visible}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sky:before{content:"";position:absolute;left:0;right:0;top:0;height:52vh;background:linear-gradient(180deg,#101830 0%,#0b1020 35%,rgba(0,0,0,0) 100%)}
.sky:after{content:"";position:absolute;left:-25%;right:-25%;bottom:-6vh;height:40vh;background:
  radial-gradient(38% 55% at 22% 78%,rgba(222,82,104,.62),transparent 70%),
  radial-gradient(40% 60% at 50% 85%,rgba(140,66,184,.66),transparent 72%),
  radial-gradient(42% 60% at 80% 78%,rgba(52,80,210,.7),transparent 72%);filter:blur(26px);transform:translateZ(0)}
@keyframes aur{to{transform:translateX(-4%) scale(1.06)}}
#app{position:relative;z-index:1;height:100dvh}
.screen{position:absolute;inset:0;overflow-y:auto;padding:calc(14px + var(--st)) 20px calc(120px + var(--sb));-webkit-overflow-scrolling:touch}
.screen.hidden{display:none}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;min-height:52px;margin-bottom:6px}
.hdr h1{font-size:26px;font-weight:500;letter-spacing:-.02em}
.hdr .sub{font-size:13px;color:var(--mut);margin-top:1px}
.arrows{display:flex;gap:8px}
.rb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--iv);background:rgba(255,255,255,.07)}
.rb svg{width:18px;height:18px}
.rb:disabled{opacity:.25}

/* hero */
.hero{padding:22px 0 6px}
.hero .lbl{font-size:13px;color:var(--mut)}
.hero .num{font-size:52px;font-weight:300;letter-spacing:-.04em;line-height:1.05;margin:4px 0 6px}
.hero .num small{font-size:24px;color:var(--mut);margin-left:6px;letter-spacing:0}
.hero .cmp{font-size:13px;color:var(--mut)}
.up-bad,.down-bad{color:var(--clay)} .down-good,.up-good{color:var(--sage)}
.c-sage{color:var(--sage)} .c-clay{color:var(--clay)} .c-mut{color:var(--mut)}
.ticks{display:flex;justify-content:space-between;align-items:flex-end;height:16px;margin:22px 0 4px}
.ticks i{position:relative;width:1.5px;height:100%;background:var(--iv);border-radius:1px;background:color-mix(in srgb,var(--iv) calc(var(--o,1) * 100%),transparent)}
.ticks i.cl::after{content:'';position:absolute;left:50%;bottom:-8px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--acc,var(--iv));opacity:.85}
.ticks i.fresh::after{animation:seal .6s var(--spring)}@keyframes seal{0%{transform:scale(0)}60%{transform:scale(2.2)}100%{transform:scale(1)}}
.ticks i.t{height:150%;background:var(--iv);opacity:1}

/* stats row */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:18px}
.stats+.stats{margin-top:0}
.stats div{padding:14px 0 14px;border-bottom:1px solid var(--line)}
.stats div+div{padding-left:14px;border-left:1px solid var(--line)}
.stats span{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.stats b{font-weight:400;font-size:16px;white-space:nowrap}
.line{display:flex;align-items:center;gap:18px;width:100%;padding:15px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--mut)}
.line b{font-weight:400;font-size:15px;color:var(--iv);margin-left:6px}
.line b.c-sage{color:var(--sage)} .line b.c-clay{color:var(--clay)}
.line .chev{margin-left:auto;width:16px;height:16px;color:var(--mut2)}

/* sections & rows */
h2{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;font-weight:500;letter-spacing:-.01em;margin:34px 0 8px}
h2 .more{font-size:13px;color:var(--mut);font-weight:400}
.dh{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);padding:18px 0 4px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:11px 0;min-height:58px}
.row+.row{border-top:1px solid var(--line)}
.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(242,239,233,.07);color:var(--iv)}
.ic svg{width:19px;height:19px;stroke-width:1.4}
.ic.sm{width:26px;height:26px}.ic.sm svg{width:14px;height:14px}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .n{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--mut)}
.row .a{font-size:15px;white-space:nowrap;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.row .a.in{color:var(--sage)}
.pct{font-size:12.5px;color:var(--mut)}
input.lim{width:96px;height:36px;border-radius:18px;background:rgba(255,255,255,.06);border:0;outline:0;padding:0 14px;text-align:right;font-size:14px}
input.lim::placeholder{color:var(--mut2)}
.ln{display:block;height:2px;border-radius:1px;background:rgba(242,239,233,.1);margin-top:6px;overflow:hidden}
.ln i{display:block;height:100%}
.limbox{margin-top:18px}
.comp{display:flex;gap:2px;height:6px;margin:4px 0 6px;border-radius:3px;overflow:hidden}
.comp i{min-width:2px}
.note{font-size:13px;color:var(--mut);line-height:1.5;margin-top:10px}
.empty{color:var(--mut);padding:40px 0 22px;line-height:1.55;text-align:center}

/* charts */
.tip{font-size:13px;color:var(--mut);margin-bottom:14px;min-height:18px}
.tip b{color:var(--iv);font-weight:400}
.bars{display:flex;align-items:flex-end;justify-content:space-between;gap:2px;position:relative}
.bars i{width:2px;flex:none;margin:0 auto;border-radius:1px;background:rgba(242,239,233,.6);min-height:2px}
.bars.wide i{width:auto;flex:1;border-radius:2px;margin:0 3px}
.bars i.z{background:rgba(242,239,233,.12)}
.bars i.hi{background:var(--iv)}
.bars i.sel{background:var(--amb)}
.bars .avgl{position:absolute;left:0;right:0;border-top:1px dashed rgba(242,239,233,.22);pointer-events:none}
.blabs{display:flex;justify-content:space-between;color:var(--mut2);font-size:11px;margin-top:8px}
.lc{position:relative}
.lc svg{width:100%;display:block;overflow:visible}
.lc .sun{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 16px 5px rgba(255,236,210,.28)}
.legend{display:flex;gap:18px;font-size:12px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:6px;background:var(--iv)}
.legend i.d{background:none;border-top:1.5px dashed var(--mut)}
.gb{display:flex;gap:10px;align-items:flex-end;height:90px}
.gb>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.gb .p{display:flex;gap:3px;align-items:flex-end;justify-content:center;width:100%;height:100%}
.gb .p i{width:4px;border-radius:2px;min-height:2px}
.gb span,.wd span{font-size:11px;color:var(--mut2)}
.wd{display:flex;justify-content:space-between;align-items:flex-end;height:70px}
.wd div{display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;flex:1}
.wd i{width:2px;border-radius:1px;background:rgba(242,239,233,.45);min-height:3px}
.wd i.mx{background:var(--iv)}

/* segmented */
.seg{display:flex;gap:4px;padding:3px;border-radius:12px;background:rgba(255,255,255,.06);margin:6px 0 2px}
.seg button{flex:1;height:32px;border-radius:9px;font-size:13.5px;color:var(--mut);text-align:center}
.seg button.on{background:rgba(255,255,255,.12);color:var(--iv)}

/* dock */
.glass{background:rgba(28,28,30,.72);border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6)}
.dock{position:fixed;left:20px;right:20px;bottom:calc(12px + var(--sb));z-index:5;display:flex;gap:10px;align-items:center}
.tabs{flex:1;display:flex;height:56px;border-radius:28px;padding:4px}
.tabs button{flex:1;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mut);font-size:10px;text-align:center}
.tabs button svg{width:22px;height:22px;stroke-width:1.4}
.tabs button.on{color:var(--iv);background:rgba(255,255,255,.09)}
.fab{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--iv);color:#000;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.fab svg{width:26px;height:26px}
.fab:active,.tabs button:active,.rb:active{transform:scale(.94)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:26px;background:var(--iv);color:#000;font-weight:500;font-size:16px;text-align:center}
.btn svg{width:18px;height:18px}
.btn:active{opacity:.85}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--iv)}
.btn.danger{background:rgba(223,123,98,.1);color:var(--clay)}
.stack{display:flex;flex-direction:column;gap:10px}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;opacity:0;pointer-events:none;transition:opacity .25s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:#111112;border-radius:28px 28px 0 0;padding:8px 20px calc(16px + var(--sb));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);max-height:94dvh;overflow-y:auto}
.sheet.on{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.16);margin:0 auto 12px}
.ktoggle{display:flex;width:200px;margin:0 auto;border-radius:12px;padding:3px;background:rgba(255,255,255,.06)}
.ktoggle button{flex:1;height:30px;border-radius:9px;font-size:13.5px;color:var(--mut);text-align:center}
.ktoggle button.on{background:rgba(255,255,255,.12);color:var(--iv)}
.amt{text-align:center;margin:18px 0 16px}
.amt .v{font-size:56px;font-weight:300;letter-spacing:-.04em;line-height:1.05}
.amt .v.ph{color:var(--mut2)}
.amt .v{display:inline-block;padding:2px 12px;border-radius:14px;transition:background .25s}
.amt .v.sel{background:color-mix(in srgb,var(--acc,#9cc3ff) 26%,transparent)}
.amth{font-size:12px;color:var(--mut);margin-top:6px;height:16px}
.amt .v small{font-size:26px;color:var(--mut);margin-left:6px}
.amt .v.in{color:var(--sage)}
.frow{display:flex;gap:8px}
.frow input.inp{flex:1;min-width:0;height:44px;border-radius:22px;background:rgba(255,255,255,.06);border:0;outline:0;padding:0 16px}
.frow input.inp::placeholder{color:var(--mut)}
.datep{position:relative;flex:none;height:44px;border-radius:22px;padding:0 14px;display:flex;align-items:center;gap:6px;font-size:14px;background:rgba(255,255,255,.06)}
.datep svg{width:16px;height:16px;color:var(--mut)}
.datep input{position:absolute;inset:0;opacity:0;width:100%}
.datep.glass{box-shadow:none;border:0;backdrop-filter:none}
.ktoggle.glass{box-shadow:none;border:0;backdrop-filter:none}
.hintl{font-size:12px;color:var(--mut);height:16px;margin:8px 4px 6px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -20px 10px;padding:2px 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.csr{flex:none;position:relative;display:flex;align-items:center;height:38px;width:38px;border-radius:19px;background:rgba(255,255,255,.06);color:var(--mut);overflow:hidden;transition:width .45s var(--spring),background .3s;cursor:pointer}
.csr svg{position:absolute;left:10px;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.csr input{width:100%;height:100%;padding:0 12px 0 34px;background:none;border:0;outline:0;color:var(--iv);opacity:0;pointer-events:none;transition:opacity .25s}
.csr.on{width:168px;background:rgba(255,255,255,.1);color:var(--iv)}.csr.on input{opacity:1;pointer-events:auto}
.chips .chip[hidden]{display:none}.cnone{align-self:center;font-size:13px;color:var(--mut);white-space:nowrap;padding-left:6px}
.chip{flex:none;display:flex;align-items:center;gap:7px;height:38px;padding:0 14px 0 11px;border-radius:19px;background:rgba(255,255,255,.06);font-size:14px;color:var(--iv)}
.chip svg{width:16px;height:16px;color:var(--mut)}
.chip.on{background:var(--iv);color:#000}
.chip.on svg{color:#000}
.pad{display:grid;grid-template-columns:repeat(3,1fr);margin:0 -6px 10px}
.pad button{height:54px;font-size:26px;font-weight:300;border-radius:14px;display:grid;place-items:center}
.pad button:active{background:rgba(255,255,255,.08)}
.pad svg{width:22px;height:22px;color:var(--mut)}

.toast{position:fixed;left:50%;top:calc(10px + var(--st));transform:translate(-50%,-100px);height:42px;padding:0 18px;border-radius:21px;display:flex;align-items:center;font-size:14px;z-index:40;transition:transform .35s cubic-bezier(.2,.9,.25,1);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.dlg{position:fixed;inset:0;display:grid;place-items:center;z-index:50;background:rgba(0,0,0,.65)}
.dlg>div{background:#1a1a1c;border-radius:22px;padding:22px;width:min(320px,86vw)}
.dlg p{margin-bottom:18px;line-height:1.45}
.dlg .b2{display:flex;gap:8px}
.dlg .btn{height:46px;font-size:15px}
textarea.csv{width:100%;height:130px;background:rgba(255,255,255,.05);color:var(--iv);border:0;border-radius:14px;padding:12px;font:11.5px ui-monospace,monospace}

.seg.mode{width:220px;margin:4px 0 0}
.hero .num.sage{color:var(--sage)}
.dayc{display:flex;align-items:center;gap:9px;width:100%;padding:13px 0;font-size:13.5px;color:var(--mut);border-bottom:1px solid var(--line);text-align:left;transition:opacity .25s,transform .25s}
.dayc svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dayc em{font-style:normal;margin-left:auto;color:var(--mut2)}
button.dayc span{color:var(--iv)}button.dayc svg{color:var(--acc,var(--iv))}
.dayc.going{opacity:0;transform:translateY(-4px)}
.dayc.done svg{color:var(--acc,var(--iv))}
.dayc.done em{font-size:12.5px;opacity:.7}
.dayc.fresh{animation:dayin .7s var(--ease)}@keyframes dayin{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:none}}
.meta{display:flex;gap:22px;font-size:13px;color:var(--mut);padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:16px}
.meta b{font-weight:400;color:var(--iv);margin-left:5px;font-size:15px}
.meta b.c-sage{color:var(--sage)}.meta b.c-clay{color:var(--clay)}
.alert{display:flex;align-items:center;gap:10px;width:100%;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.alert>span:nth-child(2){flex:1}
.alert b{font-weight:400;color:var(--mut);font-size:13px}
.compw{display:block;width:100%;padding:22px 0 6px}
.cap{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-top:8px}
.cap em{display:inline-block;width:14px}
.cap .chev{width:16px;height:16px;color:var(--mut2)}
.rb.txt{width:auto;padding:0 16px;border-radius:19px;font-size:13.5px}
.bigin{background:none;border:0;outline:0;font:inherit;color:inherit;letter-spacing:inherit;text-align:right;width:5.5ch;min-width:1ch;field-sizing:content;max-width:78vw}
.bigin::placeholder{color:var(--mut2)}
.amt .cmp{font-size:13px;color:var(--mut);margin-top:6px}
.ratelbl{display:flex;align-items:center;color:var(--mut);font-size:14px;padding:0 4px}
.ratesline{display:block;width:100%;text-align:left;margin-top:16px}

.splash{position:fixed;inset:0;z-index:100;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s ease .1s}
.splash.out{opacity:0;pointer-events:none}
.splash:after{display:none;content:"";position:absolute;left:-20%;right:-20%;bottom:-10vh;height:40vh;background:radial-gradient(38% 55% at 25% 80%,rgba(222,82,104,.45),transparent 70%),radial-gradient(40% 60% at 52% 88%,rgba(140,66,184,.5),transparent 72%),radial-gradient(42% 60% at 80% 80%,rgba(52,80,210,.55),transparent 72%);filter:blur(26px)}
.wm{display:flex;align-items:baseline;gap:10px;color:var(--iv);opacity:0;transform:translateY(6px);animation:wmIn .9s cubic-bezier(.2,.9,.25,1) .1s forwards}
.wm b{font-weight:300;font-size:44px;letter-spacing:-.03em}
.wm i{font-size:30px;color:var(--mut)}
.wm.sm b{font-size:22px}.wm.sm i{font-size:16px}
.wm.sm{opacity:1;transform:none;animation:none;justify-content:center;margin:46px 0 4px}
.splash .tag{margin-top:14px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--mut2);opacity:0;animation:wmIn .9s ease .45s forwards}
@keyframes wmIn{to{opacity:1;transform:none}}
.ver{text-align:center;font-size:11.5px;color:var(--mut2)}

.sky.flat:before,.sky.flat:after{display:none}
.sky.flat{background-attachment:fixed}
.themes{display:flex;gap:10px;overflow-x:auto;margin:6px -20px 0;padding:2px 20px 4px;scrollbar-width:none;scroll-snap-type:x proximity}.themes::-webkit-scrollbar{display:none}
.th{flex:0 0 76px;display:flex;flex-direction:column;align-items:center;gap:7px;scroll-snap-align:start}
.th .sw{position:relative;width:76px;height:112px;border-radius:16px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);color:var(--mut);overflow:hidden;background-size:cover!important;transition:box-shadow .3s,transform .45s var(--spring)}
.th .sw .acc{position:absolute;left:50%;bottom:9px;width:6px;height:6px;margin-left:-3px;border-radius:50%;opacity:.9}
.th .tn{font-size:12px;font-weight:500;color:var(--mut);transition:color .3s}
.th.on .sw{box-shadow:inset 0 0 0 1.5px var(--iv),0 0 0 3px rgba(255,255,255,.06)}
.th.on .tn{color:var(--iv)}
.thd{font-size:12.5px;color:var(--mut);margin:8px 0 0;min-height:17px}

#app,.dock{transition:opacity .8s ease}
body.boot .screen{transform:translateY(16px)}
body.boot #app,body.boot .dock{opacity:0}

/* ---- typography ---- */
.hero .num,.amt .v,.amt .v small,.hero .num small{font-family:var(--disp);font-feature-settings:"tnum" 1}
.hero .num{font-size:62px;font-weight:200;letter-spacing:-.005em;line-height:1.02}

/* grain — бумага/плёнка */
.grain{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

/* ---- iOS-like motion ---- */
:root{--spring:cubic-bezier(.3,1.45,.55,1);--ease:cubic-bezier(.2,.9,.25,1)}
button{transition:transform .45s var(--spring),background-color .25s,opacity .25s,color .25s}
button:active{transform:scale(.96);transition:transform .1s ease-out,background-color .05s}
.fab:active{transform:scale(.9)}
.pad button:active{transform:scale(.9);background:rgba(255,255,255,.1)}
.row,.crow,.line,.alert,.compw{position:relative}
.row:active,.crow:active,.line:active,.alert:active,.compw:active{transform:none}
.row:after,.crow:after,.line:after{content:"";position:absolute;inset:0 -20px;background:rgba(255,255,255,.055);opacity:0;transition:opacity .35s;pointer-events:none}
.row:active:after,.crow:active:after,.line:active:after{opacity:1;transition:opacity 0s}
.screen.enter{animation:scrIn .38s var(--ease)}
@keyframes scrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* tab + segment indicators */
.tabs{position:relative}
.tabs button.on{background:none}
.tabs .ind{position:absolute;top:4px;bottom:4px;left:0;border-radius:24px;background:rgba(255,255,255,.1);transition:transform .5s var(--spring),width .5s var(--spring);pointer-events:none}
.seg,.ktoggle{position:relative}
.seg button,.ktoggle button{position:relative;z-index:1}
.seg button.on,.ktoggle button.on{background:none}
.seg .sind,.ktoggle .sind{position:absolute;top:3px;bottom:3px;left:0;border-radius:9px;background:rgba(255,255,255,.13);transition:transform .45s var(--spring),width .45s var(--spring);pointer-events:none}
/* swipe to delete */
.swr{position:relative;overflow:hidden;margin:0 -20px;padding:0 20px}
.swr .row{transition:transform .45s var(--spring)}
.swr+.swr .row{border-top:1px solid var(--line)}
.swr .del{position:absolute;right:0;top:0;bottom:0;width:0;overflow:hidden;display:flex;transition:width .45s var(--spring)}
.swr .del button{flex:1 1 50%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-size:12px;font-weight:600;white-space:nowrap;transition:flex-basis .3s var(--spring),opacity .2s}
.swr .del svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.swr .del .edt{background:#3a3a40}.swr .del .rm{background:#d9534a}
.swr .del.full .edt{flex-basis:0;opacity:0}
.swr .del button:active{transform:none;opacity:.85}
.swr.back .row{animation:back .9s var(--ease)}@keyframes back{0%{background:rgba(255,255,255,.1)}100%{background:transparent}}
.swr .row.drag,.swr .del.drag{transition:none}
.swr.gone{transition:height .32s var(--ease),opacity .25s;opacity:0}
.toast.act{cursor:pointer}
.toast.act{padding:0 6px 0 18px;gap:12px}
.toast u{text-decoration:none;display:flex;align-items:center;gap:7px;height:32px;padding:0 13px 0 9px;border-radius:16px;background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.toast u svg{width:16px;height:16px;transform:rotate(-90deg)}.toast u circle{fill:none;stroke:rgba(255,255,255,.18);stroke-width:2}
.toast u .cd{stroke:var(--acc,#fff);stroke-dasharray:50.3;stroke-dashoffset:0;stroke-linecap:round}
.toast.on u .cd{animation:cd linear forwards}@keyframes cd{to{stroke-dashoffset:50.3}}
.sheet{transition:transform .5s var(--ease)}

/* ---- no zoom / no selection ---- */
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}

/* ---- privacy: спокойные точки ---- */
.row .a,.stats b,.meta b,.dh>span:last-child,.tip b,.kvl b,.hero .cmp,.cap>span,.hero .num>span{transition:color .3s var(--ease)}
body.priv :is(.row .a,.stats b,.meta b,.dh>span:last-child,.tip b,.kvl b),
body.priv :is(.row .a,.stats b,.meta b,.dh>span:last-child,.tip b,.kvl b) *{color:transparent!important}

body.priv :is(.row .a,.stats b,.meta b,.dh>span:last-child,.tip b,.kvl b)::after{content:"••••";position:absolute;top:50%;left:0;transform:translateY(-52%);color:var(--iv);letter-spacing:.14em;font-size:15px;line-height:1;animation:dotsIn .35s var(--ease)}

// уникальные id: одинаковые номера с разных устройств не столкнутся
let _lastId = 0;
function newId() { let v = Date.now() * 100 + Math.floor(Math.random() * 100); if (v <= _lastId) v = _lastId + 1; _lastId = v; return v; }

// что изменилось с прошлого сохранения: правки получают метку u, удалённое — запись в S.del
let SNAP = null;
const snapOf = () => { const m = new Map(); (S.tx || []).forEach(t => m.set('t' + t.id, JSON.stringify(t))); (S.acc || []).forEach(a => m.set('a' + a.id, JSON.stringify(a))); (S.goals || []).forEach(g => m.set('g' + g.id, JSON.stringify(g))); return m; };
function snap() { SNAP = snapOf(); }
function track() {
  if (!SNAP) return;
  const now = Date.now(), seen = new Set();
  S.del = S.del || {};
  const walk = (list, p) => (list || []).forEach(x => {
    const k = p + x.id; seen.add(k);
    const was = SNAP.get(k);
    if (was === undefined || was !== JSON.stringify(x)) { x.u = now; }
    if (S.del[x.id]) delete S.del[x.id]; // вернули удалённое
  });
  walk(S.tx, 't'); walk(S.acc, 'a'); walk(S.goals, 'g');
  SNAP.forEach((_, k) => { if (!seen.has(k)) S.del[k.slice(1)] = now; });
  // старые отметки об удалении больше не нужны
  const old = now - 200 * 864e5; Object.keys(S.del).forEach(id => { if (S.del[id] < old) delete S.del[id]; });
}
function afterLoad() {
  if (!S.gid) {
    const map = {};
    (S.tx || []).forEach(t => { if (t.id < 1e12) t.id = newId(); });
    (S.acc || []).forEach(a => { if (a.id < 1e12) { const n = newId(); map[a.id] = n; a.id = n; } });
    S.gid = 1;
  }
  [...(S.tx || []), ...(S.acc || []), ...(S.goals || [])].forEach(x => { if (x.id > _lastId) _lastId = x.id; });
  snap();
}

// слияние двух копий: по каждой записи берём более свежую, удалённое не воскрешаем
function mergeS(a, b) {
  const nw = (a.ts || 0) >= (b.ts || 0) ? a : b, ol = nw === a ? b : a;
  const m = Object.assign({}, ol, nw);
  const del = Object.assign({}, ol.del || {}); Object.entries(nw.del || {}).forEach(([k, v]) => { if (!del[k] || v > del[k]) del[k] = v; });
  const when = x => x.u || x.t || 0;
  const list = k => {
    const map = new Map();
    [...(ol[k] || []), ...(nw[k] || [])].forEach(x => { const p = map.get(x.id); if (!p || when(x) >= when(p)) map.set(x.id, x); });
    return [...map.values()].filter(x => !(del[x.id] && del[x.id] >= when(x)));
  };
  m.tx = list('tx').sort((x, y) => (x.t || 0) - (y.t || 0));
  m.acc = list('acc');
  m.goals = list('goals');
  m.del = del;
  m.closed = Object.assign({}, ol.closed || {}, nw.closed || {});
  const byKey = (k, f) => { const map = new Map(); [...(ol[k] || []), ...(nw[k] || [])].forEach(x => map.set(x[f], x)); return [...map.values()]; };
  m.imports = byKey('imports', 'im').slice(-10);
  m.capHist = byKey('capHist', 'd').sort((x, y) => x.d < y.d ? -1 : 1);
  const fresh = k => { const o = Object.assign({}, ol[k] || {}); Object.entries(nw[k] || {}).forEach(([c, v]) => { if (!o[c] || (v.at || 0) >= (o[c].at || 0)) o[c] = v; }); return o; };
  m.rates = fresh('rates'); m.prices = fresh('prices');
  m.ts = Math.max(a.ts || 0, b.ts || 0);
  m.gid = 1;
  return m;
}

const AT = Object.fromEntries(ATYPES.map(t => [t.id, t]));
AT.bank = { id: 'bank', n: 'Счета', i: 'a_bank', c: '#8fa6c4' }; // старые записи
const FIAT = ['RUB', 'USD', 'EUR', 'CHF', 'CNY', 'GBP', 'AED', 'TRY', 'KZT', 'JPY', 'HKD', 'SGD', 'THB', 'GEL', 'AMD'];
const COINS = {

  TRX: 'tron', DOGE: 'dogecoin', ADA: 'cardano', LTC: 'litecoin', DOT: 'polkadot', AVAX: 'avalanche-2', LINK: 'chainlink', SUI: 'sui',
  XMR: 'monero', ATOM: 'cosmos', ARB: 'arbitrum', OP: 'optimism', APT: 'aptos', SHIB: 'shiba-inu', PEPE: 'pepe', POL: 'polygon-ecosystem-token',
  NOT: 'notcoin', DOGS: 'dogs-2', HMSTR: 'hamster-kombat', PAXG: 'pax-gold', DAI: 'dai', WBTC: 'wrapped-bitcoin'

const coinId = c => (S.coins && S.coins[c]) || COINS[c];
const isCoin = c => !!coinId(c);
const CURS = [...FIAT, ...Object.keys(COINS)];
const CSYM_ = { RUB: '₽', USD: '$', EUR: '€', CNY: '¥', GBP: '£', JPY: '¥', TRY: '₺', KZT: '₸', GEL: '₾', AMD: '֏', THB: '฿', BTC: '₿', ETH: 'Ξ' };
const CSYM = new Proxy(CSYM_, { get: (o, k) => o[k] || k });
const rate = c => c === 'RUB' ? 1 : (S.rates[c] && S.rates[c].v) || 0;
const price = tk => (S.prices[tk] && S.prices[tk].v) || 0;
const unitRub = a => a.tk ? price(a.tk) : rate(a.cur);
const accRub = a => Math.round((a.type === 'debt' ? -1 : 1) * a.amt * unitRub(a) * 100); // копейки

function fmtCur(v, c) {
  const dec = isCoin(c) ? (rate(c) > 1000 ? 6 : rate(c) > 1 ? 4 : 2) : 2;
  let s = (+v).toFixed(dec);
  s = isCoin(c) ? s.replace(/0+$/, '').replace(/\.$/, '') : s.replace(/\.00$/, '');
  s = s.replace('.', ',');
  const [i, d] = s.split(',');
  s = fmtN(i) + (d ? ',' + d : '');
  return ['USD', 'EUR'].includes(c) ? CSYM[c] + s : s + ' ' + CSYM[c];
}
function snapshot() {
  const d = todayK(), v = capTotal();
  const last = S.capHist[S.capHist.length - 1];
  if (last && last.d === d) last.v = v; else S.capHist.push({ d, v });
  if (S.capHist.length > 800) S.capHist = S.capHist.slice(-800);
}
// пополнения и изъятия капитала вручную — чтобы не путать их с ростом
function capFlow(v) { if (!v) return; S.capFlow = S.capFlow || []; S.capFlow.push({ d: todayK(), v }); if (S.capFlow.length > 400) S.capFlow = S.capFlow.slice(-400); }
let ratesBusy = false;
async function fetchRates(force = false) {
  const need = [...new Set([...S.acc.filter(a => !a.tk).map(a => a.cur), S.base || 'RUB'])].filter(c => c !== 'RUB');
  const tks = [...new Set(S.acc.filter(a => a.tk).map(a => a.tk))];
  if ((!need.length && !tks.length) || ratesBusy) return;
  if (!force && S.ratesAt && Date.now() - S.ratesAt < 30 * 60e3) return;
  ratesBusy = true;
  let ok = false;
  try {
    const r = await fetch('https://www.cbr-xml-daily.ru/daily_json.js').then(r => r.json());
    FIAT.forEach(c => { const x = r.Valute[c]; if (x) { S.rates[c] = { v: x.Value / x.Nominal, at: Date.now(), src: 'ЦБ' }; ok = true; } });
  } catch (e) {}
  if (await fetchCoins(need.filter(isCoin))) ok = true;
  if (tks.length) { const got = await fetchMoex(tks); if (got) ok = true; }
  ratesBusy = false;
  if (ok) { S.ratesAt = Date.now(); snapshot(); save(); if (tab === 'cap') render(); }
  else if (force) toast('Не удалось обновить курсы');
}
async function fetchCoins(cs) {
  if (!cs.length) return false;
  const ids = [...new Set(cs.map(coinId))];
  try {
    const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids.join(',')}&vs_currencies=rub&include_24hr_change=true`).then(r => r.json());
    let ok = false;
    cs.forEach(c => { const x = r[coinId(c)]; if (x && x.rub) { S.rates[c] = { v: x.rub, ch: x.rub_24h_change, at: Date.now(), src: 'CoinGecko' }; ok = true; } });
    return ok;
  } catch (e) { return false; }
}

async function coinPick(i) {

  const sym = c.symbol.toUpperCase();
  S.coins = S.coins || {}; if (!COINS[sym] || COINS[sym] !== c.id) S.coins[sym] = c.id;
  syncAcc(); A.cur = sym; haptic(); drawAcc();

async function fetchMoex(tks) {
  let ok = false;
  for (const [market, board] of [['shares', 'TQBR'], ['shares', 'TQTF']]) {
    const left = tks.filter(t => !(S.prices[t] && S.prices[t].at > Date.now() - 60e3));
    if (!left.length) break;
    try {
      const u = `https://iss.moex.com/iss/engines/stock/markets/${market}/boards/${board}/securities.json?securities=${left.join(',')}&iss.meta=off&iss.only=marketdata,securities&marketdata.columns=SECID,LAST,LCURRENTPRICE&securities.columns=SECID,SHORTNAME,PREVPRICE`;
      const r = await fetch(u).then(r => r.json());
      const names = Object.fromEntries((r.securities.data || []).map(([id, n, pp]) => [id, { n, pp }]));
      (r.marketdata.data || []).forEach(([id, last, cur]) => {
        const v = last || cur || (names[id] && names[id].pp);
        if (v) { S.prices[id] = { v, at: Date.now(), name: names[id] ? names[id].n : id, src: 'Мосбиржа' }; ok = true; }
      });
    } catch (e) {}
  }
  return ok;
}
function ago(ts) {
  const m = Math.round((Date.now() - ts) / 60e3);
  if (m < 1) return 'только что'; if (m < 60) return `${m} мин назад`;
  const h = Math.round(m / 60); if (h < 24) return `${h} ч назад`;
  return new Date(ts).toLocaleDateString('ru-RU');
}

    const k = t.n.trim().toLowerCase(); const e = g[k] || (g[k] = { n: t.n.trim(), c: t.c, a: t.a, cnt: 0, last: 0 });

const ST_DATE = /^(\d{2})\.(\d{2})\.(\d{4})$/;

const ST_TIME = /^\d{2}:\d{2}(:\d{2})?$/;

const stTxt = r => r.items.map(i => i.s).join(' ').replace(/\s+/g, ' ').trim();
const stAmt = s => { const neg = /^[\-−–]/.test(s.trim()), pos = /^\+/.test(s.trim()); const v = parseFloat(s.replace(/[^\d.,]/g, '').replace(',', '.')); return { v: Math.round(v * 100), sign: neg ? -1 : pos ? 1 : 0 }; };

function stBank(text) {

function parseRows(rows) {
  rows = rows.filter(r => r.items.length);
  // колонка описания и строки шапки
  let descX = null;
  const isHead = new Set();
  rows.forEach((r, i) => {
    const tx = stTxt(r);
    if (/дата/i.test(tx) && /(описан|назначен|операци|сумм)/i.test(tx) && !r.items.some(it => ST_DATE_IN.test(it.s.trim()))) {
      isHead.add(i);
      const d = r.items.find(it => /^(описан|назначен)/i.test(it.s.trim()));
      if (d && descX == null) descX = d.x;
      for (let j = i + 1; j < rows.length && j < i + 6; j++) {
        if (rows[j].p !== r.p || Math.abs(rows[j].y - rows[j - 1].y) > 16) break;
        if (rows[j].items.every(it => ST_HEAD.test(it.s.trim()))) { isHead.add(j); const d2 = rows[j].items.find(it => /^(описан|назначен)/i.test(it.s.trim())); if (d2 && descX == null) descX = d2.x; } else break;
      }
    }
  });
  // строки-операции: первая ячейка — дата, и в строке есть сумма
  const isOp = rows.map((r, i) => {
    if (isHead.has(i)) return false;
    const f = r.items[0]; if (!f || !ST_DATE_IN.test(f.s.trim())) return false;
    if (descX != null && f.x > descX - 20) return false;
    return r.items.some(it => ST_AMT.test(it.s.trim()));
  });
  const opIdx = isOp.map((v, i) => v ? i : -1).filter(i => i >= 0);
  if (!opIdx.length) return null;
  if (descX == null) { const xs = opIdx.map(i => rows[i].items.find(it => /[A-Za-zА-Яа-яЁё]{3}/.test(it.s))).filter(Boolean).map(it => it.x).sort((a, b) => a - b); descX = xs[Math.floor(xs.length / 2)] || 150; }

  // описание по центру строки (текст и выше, и ниже даты) или сверху
  const firstOp = opIdx[0];
  let centered = false;
  for (let i = firstOp - 1; i >= 0 && rows[i].p === rows[firstOp].p; i--) {
    if (isHead.has(i)) break;
    if (Math.abs(rows[i].y - rows[i + 1].y) > 16) break;
    if (rows[i].items[0].x >= descX - 20) { centered = true; break; }
  }
  const firstX = i => { const it = rows[i].items.find(it => !ST_TIME.test(it.s.trim()) && !ST_DATE_IN.test(it.s.trim())); return it ? it.x : -1; };
  const cont = i => !isHead.has(i) && !isOp[i] && firstX(i) >= descX - 25 && !ST_JUNK.test(stTxt(rows[i]));

  if (centered) {
    rows.forEach((r, i) => {
      if (!cont(i)) return;
      let best = -1, bd = 1e9;
      opIdx.forEach((oi, k) => { if (rows[oi].p !== r.p) return; const d = Math.abs(rows[oi].y - r.y); if (d < bd) { bd = d; best = k; } });
      if (best >= 0 && bd < 40) attach[best].push(i);
    });
  } else {
    opIdx.forEach((oi, k) => {
      let prevY = rows[oi].y;
      for (let i = oi + 1; i < rows.length && !isOp[i]; i++) {
        if (rows[i].p !== rows[oi].p || prevY - rows[i].y > 18) break;
        if (cont(i)) attach[k].push(i); else if (isHead.has(i)) break;
        prevY = rows[i].y;
      }
    });
  }

  const out = [];
  opIdx.forEach((oi, k) => {
    const r = rows[oi];
    const d = stISO(r.items[0].s.trim().match(/^(\d{2})\.(\d{2})\.(\d{4})/));
    const amts = [];
    const desc = [];
    r.items.forEach((it, j) => {
      const s = it.s.trim();
      if (j === 0 || ST_DATE_IN.test(s) || ST_TIME.test(s) || ST_CUR.test(s)) return;
      if (ST_AMT.test(s)) { const next = r.items[j + 1]; amts.push({ ...stAmt(s), rub: /₽|RUB|RUR|руб/i.test(s) || (next && /^(₽|RUB|RUR|руб)/i.test(next.s.trim())), x: it.x }); return; }

      if (/^\d{4}$/.test(s) && it.x > descX + 60) return; // номер карты
      desc.push({ y: r.y, x: it.x, s });
    });
    attach[k].forEach(i => rows[i].items.forEach(it => { const s = it.s.trim(); if (!ST_TIME.test(s) && !ST_DATE_IN.test(s) && it.x >= descX - 25) desc.push({ y: rows[i].y, x: it.x, s }); }));
    desc.sort((a, b) => b.y - a.y || a.x - b.x);

    const main = desc.filter(t => t.x < descX + 140).map(t => t.s).join(' ');
    const side = desc.filter(t => t.x >= descX + 140).map(t => t.s).join(' ');

    text = text.replace(/\s?\b\d{4}$/, '').trim(); // номер карты в последней колонке

    let a, k2;

      const inc = amts[1].v, exp = amts[2].v;

    } else {
      const pick = amts.find(x => x.rub) || amts[0];

    }
    if (!a) return;
    out.push({ d, a, k: k2, raw: text });
  });
  return out;
}

      .forEach(([n, type, cur, amt]) => S.acc.push({ id: newId(), n, type, cur, amt, tk: '', t: at }));
    Object.assign(S.prices, { SBER: { v: 300, at, name: 'Сбербанк', src: 'демо' }, YDEX: { v: 4200, at, name: 'Яндекс', src: 'демо' }, LQDT: { v: 1.8, at, name: 'Ликвидность', src: 'демо' } });
    [['Сбербанк', 'SBER', 300], ['Яндекс', 'YDEX', 15], ['Фонд ликвидности', 'LQDT', 20000]].forEach(([n, tk, q]) => S.acc.push({ id: newId(), n, type: 'stocks', cur: 'RUB', amt: q, tk, t: at }));
    const end = capTotal(); S.capHist = [];
    for (let i = 90; i >= 1; i--) { const f = 0.86 + 0.14 * (90 - i) / 90 + Math.sin(i / 6) * 0.012; S.capHist.push({ d: key(addD(today(), -i)), v: Math.round(end * f) }); }
    snapshot();
  }
  save(); render(); toast('Демо-данные загружены');
}
